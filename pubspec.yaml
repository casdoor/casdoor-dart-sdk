name: casdoor_dart_sdk
description: Dart SDK for Casdoor, for Dart backends (Shelf, Dart Frog, Serverpod and any server-side Dart code).
version: 0.1.0
homepage: https://casdoor.org
repository: https://github.com/casdoor/casdoor-dart-sdk
issue_tracker: https://github.com/casdoor/casdoor-dart-sdk/issues
topics:
  - casdoor
  - oauth
  - authentication
  - authorization

environment:
  sdk: ^3.4.0

dependencies:
  dart_jsonwebtoken: ^3.2.0
  http: ^1.2.0

dev_dependencies:
  lints: ">=4.0.0 <7.0.0"
  test: ^1.25.0

# the test keys are generated for the tests only
false_secrets:
  - /test/data/*_key.pem
